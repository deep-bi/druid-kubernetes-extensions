name: Pull-request Workflow

on:
  pull_request:
    branches:
      - master
      - 'deep/**'

jobs:
  build-and-test:
    name: Build and Test Extensions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Verify
        run: |
          mvn clean verify -B

    
